name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build Windows EXE
      run: |
        pyinstaller --onefile --windowed --name=DocumentConverter --noupx --clean --version-file=version_info.txt --hidden-import=tkinter --hidden-import=tkinter.filedialog --hidden-import=tkinter.messagebox --hidden-import=ttkbootstrap --hidden-import=PIL --hidden-import=ezodf --hidden-import=pyexcel --hidden-import=pyexcel_ods --hidden-import=docx --hidden-import=reportlab --hidden-import=lxml --hidden-import=converter_engine --hidden-import=security_manifest --hidden-import=windows_compatibility --collect-all=ttkbootstrap --collect-all=reportlab main.py
        
    - name: Test EXE
      run: |
        dist\DocumentConverter.exe --version
        
    - name: Create User Package
      run: |
        mkdir release
        copy dist\DocumentConverter.exe release\
        echo # 文檔轉換工具 > release\使用說明.txt
        echo. >> release\使用說明.txt
        echo 1. 雙擊 DocumentConverter.exe 啟動程式 >> release\使用說明.txt
        echo 2. 選擇要轉換的檔案 (ODS, ODT, ODP) >> release\使用說明.txt
        echo 3. 選擇輸出格式 (TXT, CSV, HTML, DOCX, PDF) >> release\使用說明.txt
        echo 4. 點擊開始轉換 >> release\使用說明.txt
        echo. >> release\使用說明.txt
        echo 系統需求: Windows 10/11 >> release\使用說明.txt
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DocumentConverter-Windows
        path: release/