# macOS Apple Silicon native reference configuration.
# The backend runtime settings are read from environment variables/.env;
# this file documents the platform contract for legacy tooling only.

platform: macos
deployment_mode: native

llm:
  provider: lmstudio
  lmstudio:
    # Native LM Studio API root; the backend adds /v1 only for chat calls.
    base_url: http://127.0.0.1:1234
    api_key: lm-studio
    timeout: 1800
    max_tokens: 3072
    temperature: 0.2
  cloud:
    provider: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.5-flash-lite
    timeout: 600
    max_tokens: 8192

whisper:
  # auto resolves to mlx_whisper on Darwin ARM64. Explicit transformers or
  # faster_whisper remains available as a deliberate compatibility override.
  backend: auto
  language: auto
  compute_type: float16
  beam_size: 5

gpu:
  enabled: true
  accelerator: mlx-metal
  auto_detect: true

data:
  base_dir: ./data
  uploads_dir: ./data/uploads
  outputs_dir: ./data/outputs
  cache_dir: ./data/cache

service:
  host: 0.0.0.0
  port: 9527
  reload: false
  workers: 1

queue:
  max_concurrent_tasks: 1
  max_queue_size: 50
  estimated_minutes_per_task: 4

upload:
  max_file_size_mb: 200
  enable_batch_upload: false

features:
  websocket: true
  realtime_progress: true
  auto_cleanup: true
  task_queue: true
