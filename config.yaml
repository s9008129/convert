# =====================================================
# 會議轉錄工具 - 配置檔
# Windows 11 + RTX 4090 + Ollama 本地 LLM
# =====================================================

# ===== LLM 設定 =====
llm:
  provider: "ollama"
  
  ollama:
    # Ollama 服務位址（預設本地）
    base_url: "http://localhost:11434"
    
    # 使用的模型
    # 推薦選項：
    #   - qwen2.5:7b       中文優化，推薦首選
    #   - llama3.1:8b      平衡速度與品質
    #   - mistral:7b       快速，英文較好
    #   - llama3.1:70b     最高品質（需 40GB+ VRAM）
    model: "qwen2.5:7b"
    
    # 上下文視窗大小（token 數）
    # 影響可處理的逐字稿長度
    # 8192   = 約 6,000 中文字
    # 32768  = 約 24,000 中文字（推薦）
    # 65536  = 約 50,000 中文字
    # 131072 = 約 100,000 中文字（需模型支援）
    num_ctx: 32768
    
    # 超時設定（秒）
    # 長逐字稿需要更多時間處理
    timeout: 600
    
    # 生成參數
    temperature: 0.7       # 0.0-1.0，越低越精確
    max_output_tokens: 4096  # 最大輸出長度

# ===== Whisper 語音轉錄設定 =====
whisper:
  # faster-whisper-xxl.exe 的路徑
  # 可以是相對路徑或絕對路徑
  exe_path: "faster-whisper-xxl.exe"
  
  # 模型大小
  # tiny    = 最快，準確度較低（約 75MB）
  # base    = 快速（約 145MB）
  # small   = 平衡（約 465MB）
  # medium  = 較準確（約 1.5GB）
  # large-v3 = 最準確，推薦（約 3GB）
  model: "large-v3"
  
  # 語言代碼
  # zh = 中文（繁體/簡體自動識別）
  # en = 英文
  # ja = 日文
  # auto = 自動偵測（較慢）
  language: "zh"
  
  # 運算裝置
  # auto = 自動選擇（推薦）
  # cuda = NVIDIA GPU
  # cpu  = CPU（較慢）
  device: "auto"
  
  # 計算精度（僅 CUDA）
  # float16     = 標準精度
  # int8_float16 = 混合精度，較省 VRAM
  # int8        = 最省 VRAM
  compute_type: "float16"

# ===== 路徑設定 =====
paths:
  input: "input"     # 輸入音訊/視訊檔案
  output: "output"   # 輸出 Markdown 摘要
  temp: "temp"       # 暫存（逐字稿快取）
  logs: "logs"       # 日誌檔案

# ===== 系統提示詞 =====
# 會議記錄摘要專用提示詞 (COSTAR-X 框架)
# 融合 COSTAR-A 與 Phil Schmid 的 Gemini 提示實踐指南
# 優化目標：本地 Gemma 3 12B/27B 模型
system_prompt: |
  <system_instruction>
  <role>
  你是一位專業的政府機關資深承辦人員與專案經理。你擅長從雜亂的會議逐字稿中提取關鍵資訊，並轉化為結構清晰、符合台灣政府機關公文風格的繁體中文會議記錄。你的風格是客觀、精準且簡練。
  </role>

  <instructions>
  請依照以下步驟處理會議逐字稿：

  1. **Analyze (分析)**：閱讀全文，識別會議的「主要議題」、「關鍵決策」與「待辦事項」。
  2. **Filter (過濾)**：忽略寒暄、冗言贅字或無關的閒聊。
  3. **Structure (結構化)**：將資訊填入指定的輸出格式中。
  4. **Refine (修飾)**：確保所有內容皆為流暢的繁體中文 (Traditional Chinese)，並檢查是否有遺漏的人名或期限。
  </instructions>

  <constraints>
  - **Language**：輸出必須是 100% 繁體中文（台灣用語）。
  - **Tone**：台灣政府機關公文書寫風格，正式、客觀、不帶情緒色彩。
  - **Accuracy**：若逐字稿中有模糊不清的數據，請標註「(待確認)」，不可瞎編。
  - **Formatting**：嚴格遵守指定格式，不要輸出多餘的引導語或解釋。
  - **Completeness**：每個區塊都必須填寫，若該區塊無相關內容則標註「無」。
  </constraints>

  <output_format>
  請依序輸出以下區塊（使用 Markdown）：

  # 會議記錄摘要

  ## 1. 會議概況
  - **日期**：[YYYY/MM/DD]（如有提及）
  - **參與者**：[列出人名]（如有提及）
  - **會議主題**：[根據內容推斷]

  ## 2. 執行摘要 (Executive Summary)
  [用 100 字以內總結會議核心結論]

  ## 3. 詳細議題與決議 (Discussion & Decisions)
  - **議題 1**：[標題]
    - *討論重點*：...
    - *最終決議*：...
  - **議題 2**：...
  （依此類推）

  ## 4. 待辦事項 (Action Items) - 必填
  | 待辦事項 | 負責人 | 期限 |
  | :--- | :--- | :--- |
  | [具體事項] | [人名] | [時間] |

  ## 5. 其他備註
  - 其他重要但不屬於上述分類的內容
  - 特殊情況說明
  </output_format>
  </system_instruction>

  <final_instruction>
  請深呼吸，一步步執行上述分析步驟，確保沒有遺漏任何輸出格式中的欄位。現在開始：
  </final_instruction>

# ===== 進階設定 =====
advanced:
  # 是否使用逐字稿快取
  # 開啟後，相同檔案不會重複轉錄
  use_cache: true
  
  # 是否顯示詳細日誌
  verbose: false
  
  # 處理失敗時是否繼續處理下一個檔案
  continue_on_error: true
  
  # 輸出檔案格式
  # markdown = .md 檔案
  # txt = 純文字
  output_format: "markdown"
  
  # 是否在輸出中包含原始逐字稿
  include_transcript: true
  
  # 最大重試次數
  max_retries: 3
