# =====================================================
# 會議轉錄工具 - 配置檔
# Windows 11 + RTX 4090 + Ollama 本地 LLM
# =====================================================

# ===== LLM 設定 =====
llm:
  provider: "ollama"
  
  ollama:
    # Ollama 服務位址（預設本地）
    base_url: "http://localhost:11434"
    
    # 使用的模型
    # 推薦選項：
    #   - qwen2.5:7b       中文優化，推薦首選
    #   - llama3.1:8b      平衡速度與品質
    #   - mistral:7b       快速，英文較好
    #   - llama3.1:70b     最高品質（需 40GB+ VRAM）
    model: "gemma3:270m"
    
    # 上下文視窗大小（token 數）
    # 影響可處理的逐字稿長度
    # 8192   = 約 6,000 中文字
    # 32768  = 約 24,000 中文字（推薦）
    # 65536  = 約 50,000 中文字
    # 131072 = 約 100,000 中文字（需模型支援）
    num_ctx: 32768
    
    # 超時設定（秒）
    # 長逐字稿需要更多時間處理
    timeout: 600
    
    # 生成參數
    temperature: 0.7       # 0.0-1.0，越低越精確
    max_output_tokens: 4096  # 最大輸出長度

# ===== Whisper 語音轉錄設定 =====
whisper:
  # faster-whisper-xxl.exe 的路徑
  # 可以是相對路徑或絕對路徑
  exe_path: "Faster-Whisper-XXL/faster-whisper-xxl.exe"

  # 後端選項：auto / python / exe
  # 建議使用 python，可避免 PyInstaller 依賴問題
  backend: "python"
  
  # 模型大小
  # tiny    = 最快，準確度較低（約 75MB）
  # base    = 快速（約 145MB）
  # small   = 平衡（約 465MB）
  # medium  = 較準確（約 1.5GB）
  # large-v3 = 最準確，推薦（約 3GB）
  model: "large-v3"
  
  # 語言代碼
  # zh = 中文（繁體/簡體自動識別）
  # en = 英文
  # ja = 日文
  # auto = 自動偵測（較慢）
  language: "zh"
  
  # 運算裝置
  # auto = 自動選擇（推薦）
  # cuda = NVIDIA GPU
  # cpu  = CPU（較慢）
  device: "auto"
  
  # 計算精度（僅 CUDA）
  # float16     = 標準精度
  # int8_float16 = 混合精度，較省 VRAM
  # int8        = 最省 VRAM
  compute_type: "float16"

# ===== 路徑設定 =====
paths:
  input: "input"     # 輸入音訊/視訊檔案
  output: "output"   # 輸出 Markdown 摘要
  temp: "temp"       # 暫存（逐字稿快取）
  logs: "logs"       # 日誌檔案

# ===== 系統提示詞 =====
# 會議記錄摘要專用提示詞
# 可依需求自訂
system_prompt: |
  你是一位專業的政府機關資深承辦人員，擅長整理會議紀錄。
  
  請根據以下逐字稿，整理出結構化的會議摘要。
  
  ## 輸出要求
  
  1. 使用台灣繁體中文
  2. 語氣正式專業
  3. 重點摘要，避免冗長
  4. 保留重要的人名、日期、數字
  5. 不要虛構或添加逐字稿中沒有的內容
  
  ## 輸出格式
  
  ### 一、會議概要
  - 會議主題（根據內容推斷）
  - 主要與會者（如有提及）
  - 會議時長（如有提及）
  
  ### 二、議題與決議（約 400 字）
  - 列出主要討論議題
  - 說明最終決議或共識
  - 標註表決結果（如有）
  
  ### 三、問題與解決方案（約 300 字）
  - 列出會議中提出的問題
  - 說明對應的解決方案或處理方式
  - 標註待解決的問題
  
  ### 四、追蹤事項（約 300 字）
  - 列出需要追蹤的事項
  - 標註負責人（如有提及）
  - 標註預計完成時間（如有提及）
  
  ### 五、其他備註
  - 其他重要但不屬於上述分類的內容
  - 特殊情況說明

# ===== 進階設定 =====
advanced:
  # 是否使用逐字稿快取
  # 開啟後，相同檔案不會重複轉錄
  use_cache: true
  
  # 是否顯示詳細日誌
  verbose: false
  
  # 處理失敗時是否繼續處理下一個檔案
  continue_on_error: true
  
  # 輸出檔案格式
  # markdown = .md 檔案
  # txt = 純文字
  output_format: "markdown"
  
  # 是否在輸出中包含原始逐字稿
  include_transcript: true
  
  # 最大重試次數
  max_retries: 3
