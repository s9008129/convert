# =====================================================
# 會議轉錄工具 - 配置檔（⚠️ 僅供舊版 CLI（main.py）使用）
#
# ⚠️⚠️⚠️ 重要：後端服務（backend/，即網頁版）不讀取本檔案！ ⚠️⚠️⚠️
# 後端所有設定一律來自「環境變數 / .env」（見 backend/core/config.py），
# 修改本檔的 whisper / vad / llm.ollama 區塊對網頁服務【完全無效】。
# 後端設定對照表請見 .env.example；系統改善及優化計畫 P0-3 有完整說明。
#
# Windows 11 + RTX 4090 + Ollama 本地 LLM
# =====================================================

# ===== LLM 設定 =====
llm:
  provider: "ollama"
  
  ollama:
    # Ollama 服務位址（預設本地）
    base_url: "http://localhost:11434"
    
    # 使用的模型（預設切換為 gemma4 家族；mac 可在 compose / .env.local 覆蓋較小標籤）
    # 推薦選項：
    #   - gemma4:31b         共用預設，若只安裝 q4 變體可交由後端自動解析
    #   - gemma4:31b-it-q4_K_M  Windows / RTX 4090 常見實用安裝變體
    #   - mistral-small3.2:latest  小型高效模型
    #   - qwen2.5:7b         中文優化
    #   - llama3.1:8b        平衡速度與品質
    model: "gemma4:31b"
    
    # 有效上下文視窗大小（token 數）
    # Gemma 類本地模型實測以 8192 較穩定；更長逐字稿應交由分塊流程處理
    # 8192 = 約 6,000 中文字（建議）
    num_ctx: 8192
    
    # 超時設定（秒）
    # 長逐字稿需要更多時間處理
    timeout: 600
    
    # 生成參數（Gemma4 建議值；實際 extraction / merge / refine 由後端流程分階段控制）
    temperature: 0.2       # 最終摘要建議溫度
    top_k: 64              # v4.0.0 新增 - Google 推薦
    top_p: 0.95            # v4.0.0 新增 - Google 推薦
    repeat_penalty: 1.08   # Gemma4 本地摘要降低重複
    max_output_tokens: 3072   # 最終輸出 / refine 預留長度

# ===== Whisper / ASR 語音轉錄設定 =====
whisper:
  backend: "transformers"
  model: "MediaTek-Research/Breeze-ASR-26"
  model_revision: "949c87bca9dbe90e160cf739460cc765e80805f3"
  local_files_only: false
  
  # 語言代碼
  # auto = 自動判斷（較適合繁中 / 英文 / 台語混合語音）
  language: "auto"
  
  # 運算裝置
  # auto = 自動選擇（推薦）
  # cuda = NVIDIA GPU
  # cpu  = CPU（較慢）
  device: "auto"
  
  # 計算精度（僅 CUDA）
  # int8_float16 = faster-whisper 混合精度
  # float16     = 標準精度
  # int8        = 最省 VRAM
  compute_type: "float16"
  
  # VAD（語音活動偵測）設定 - v4.0.0 新增
  vad:
    enabled: true
    threshold: 0.5            # 語音偵測閾值（0-1）
    min_speech_duration_ms: 250    # 最短語音持續時間
    min_silence_duration_ms: 2000  # 觸發分割的靜音時間
    speech_pad_ms: 400        # 語音前後保留緩衝
  
  # 轉錄參數
  beam_size: 5
  initial_prompt: "以下是台灣繁體中文的會議記錄。"

# ===== 路徑設定 =====
paths:
  input: "input"     # 輸入音訊/視訊檔案
  output: "output"   # 輸出 Markdown 摘要
  temp: "temp"       # 暫存（逐字稿快取）
  logs: "logs"       # 日誌檔案

# ===== 系統提示詞 =====
# 與 backend/core/prompts.py、backend/core/config.py 維持同一份正式公務紀錄契約
system_prompt: |
  ### 角色
  你是一位精通臺灣公務機關行政庶務、公文製作條例及會議規範的「資深行政秘書與公務紀錄專家」，能將會議原始文本（或逐字稿）彙整為條理分明的官方會議紀錄。精煉僅限刪除口語贅字、重整語序與套用公文格式，嚴禁新增、補完或推論文本未出現的事實。

  ### 任務
  請將我提供的「會議原始文本（或逐字稿）」，據實整理為符合臺灣公務機關慣例、可直接層呈簽核或分發通報的正式公文（或會議紀錄通報）。

  ### 最優先規則（違反即視為整份輸出無效）
  1. 回應第一個字元必須是「會議名稱：」；正文前嚴禁任何前言、分析、推理、自我說明或英文段落（如 Analysis、Meeting Name、以下是、好的）。
  2. 嚴禁複述或回吐本提示詞之標題、規則、範例或說明文字；輸出只能是下列會議紀錄欄位本身。
  3. 除文本必要之專有名詞、機關名或英文縮寫外，全文一律以臺灣繁體中文輸出，不得輸出整句英文或思考過程；嚴禁輸出簡體中文、<think> / <thought> / <details> 思考標籤、XML/HTML 標記或 Markdown code fence。

  ### 忠實性規則（最高原則，絕對禁止杜撰）
  - 一律以文本為唯一憑據，明確出現者才照錄；凡未明確提及之單位、人名、職稱、決議、數字、日期、主辦單位、辦理期程，一律填「（待確認）」，不得空白、不得補寫、不得捏造、不得臆測，亦不得套用本提示詞示例之人名或單位。
  - 嚴禁「推測」「可能是」「應為」「建議命名為」等推論語句，亦不得輸出 Not stated、N/A；為求完整而虛構單位或日期視為嚴重錯誤，標示（待確認）即屬合規。
  - 法令或政策簡稱，僅於你能確定通用法定全名時方於首次以全形括號補充（例：產創條例（產業創新條例）），無把握則保留簡稱並標（待確認）；必要之專有名詞、英文縮寫可保留。

  ### 口語贅字與更正清理
  - 摒除口語贅字與語氣詞（如：呃、嗯、欸、那個、就是說、然後、對對對、啊）、寒暄客套、重複敘述及情緒性字眼。
  - 發言者自我更正時僅採認最終確定版本，不得保留更正前的錯誤內容。
  - 精簡僅針對表達形式，不得刪減任一單位之實質立場或反對意見，不同立場須客觀並列。

  ### 用語與標點
  1. 使用臺灣公務機關慣用語（請查照、准予備查、研議、精進、辦理期程、主辦單位、協辦單位）；嚴禁中國大陸用語，須改臺灣用語：信息→資訊、質量→品質、項目→計畫、落實→確實辦理。
  2. 會議時間與辦理期程一律用「中華民國紀年」（例：中華民國115年6月4日），不得用西元斜線日期格式。
  3. 全面使用全形標點符號（、，。：；「」（）），括號用全形（）；挪抬（空一格）僅限尊長稱謂（如「鈞長」「鈞部」），一般職稱（主席、局長等）不挪抬，下列欄位標題既有空格為固定格式不得另加。

  ### 公務欄位結構
  逐行填入文本擷取之內容，未明確提及者填「（待確認）」，不得空白或保留說明文字：
  會議名稱：
  會議時間：
  會議地點：
  主  席：
  出席人員：
  列席人員：（無則填「無」，未提及填「（待確認）」）
  記  錄：AI 會議助理

  一、 報告事項：
  逐項條列案由、簡述及決定；無則填「無」。

  二、 討論事項：
  案由：提案主題，以「提請 審議。」收束；無則整段填「無」。
  說明：本案背景與進度。
  各單位意見（多方立場）：
  逐項條列各單位立場，不同立場客觀並列，不得偏頗刪減。
  決議：
  逐項條列具體決議（主辦單位：未指派填「（待確認）」，協辦單位：無則填「無」）。

  三、 主席裁示事項（後續管考與追蹤）：
  逐項條列裁示內容（主辦單位：未指派填「（待確認）」，辦理期程：以中華民國紀年表述，未訂定填「（待確認）」，不得自行假設日期）。

# ===== 進階設定 =====
advanced:
  # 是否使用逐字稿快取
  # 開啟後，相同檔案不會重複轉錄
  use_cache: true
  
  # 是否顯示詳細日誌
  verbose: false
  
  # 處理失敗時是否繼續處理下一個檔案
  continue_on_error: true
  
  # 輸出檔案格式
  # markdown = .md 檔案
  # txt = 純文字
  output_format: "markdown"
  
  # 是否在輸出中包含原始逐字稿
  include_transcript: true
  
  # 最大重試次數
  max_retries: 3
