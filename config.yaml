# =====================================================
# 會議轉錄工具 - 配置檔
# Windows 11 + RTX 4090 + Ollama 本地 LLM
# =====================================================

# ===== LLM 設定 =====
llm:
  provider: "ollama"
  
  ollama:
    # Ollama 服務位址（預設本地）
    base_url: "http://localhost:11434"
    
    # 使用的模型（預設切換為 gemma4 家族；mac 可在 compose / .env.local 覆蓋較小標籤）
    # 推薦選項：
    #   - gemma4:31b         共用預設，若只安裝 q4 變體可交由後端自動解析
    #   - gemma4:31b-it-q4_K_M  Windows / RTX 4090 常見實用安裝變體
    #   - mistral-small3.2:latest  小型高效模型
    #   - qwen2.5:7b         中文優化
    #   - llama3.1:8b        平衡速度與品質
    model: "gemma4:31b"
    
    # 有效上下文視窗大小（token 數）
    # Gemma 類本地模型實測以 8192 較穩定；更長逐字稿應交由分塊流程處理
    # 8192 = 約 6,000 中文字（建議）
    num_ctx: 8192
    
    # 超時設定（秒）
    # 長逐字稿需要更多時間處理
    timeout: 600
    
    # 生成參數（Gemma4 建議值；實際 extraction / merge / refine 由後端流程分階段控制）
    temperature: 0.2       # 最終摘要建議溫度
    top_k: 64              # v4.0.0 新增 - Google 推薦
    top_p: 0.95            # v4.0.0 新增 - Google 推薦
    repeat_penalty: 1.08   # Gemma4 本地摘要降低重複
    max_output_tokens: 3072   # 最終輸出 / refine 預留長度

# ===== Whisper / ASR 語音轉錄設定 =====
whisper:
  backend: "transformers"
  model: "MediaTek-Research/Breeze-ASR-26"
  model_revision: "949c87bca9dbe90e160cf739460cc765e80805f3"
  local_files_only: false
  
  # 語言代碼
  # auto = 自動判斷（較適合繁中 / 英文 / 台語混合語音）
  language: "auto"
  
  # 運算裝置
  # auto = 自動選擇（推薦）
  # cuda = NVIDIA GPU
  # cpu  = CPU（較慢）
  device: "auto"
  
  # 計算精度（僅 CUDA）
  # int8_float16 = faster-whisper 混合精度
  # float16     = 標準精度
  # int8        = 最省 VRAM
  compute_type: "float16"
  
  # VAD（語音活動偵測）設定 - v4.0.0 新增
  vad:
    enabled: true
    threshold: 0.5            # 語音偵測閾值（0-1）
    min_speech_duration_ms: 250    # 最短語音持續時間
    min_silence_duration_ms: 2000  # 觸發分割的靜音時間
    speech_pad_ms: 400        # 語音前後保留緩衝
  
  # 轉錄參數
  beam_size: 5
  initial_prompt: "以下是台灣繁體中文的會議記錄。"

# ===== 路徑設定 =====
paths:
  input: "input"     # 輸入音訊/視訊檔案
  output: "output"   # 輸出 Markdown 摘要
  temp: "temp"       # 暫存（逐字稿快取）
  logs: "logs"       # 日誌檔案

# ===== 系統提示詞 =====
# 與 backend/core/prompts.py、backend/core/config.py 維持同一份正式公務紀錄契約
system_prompt: |
  ### 角色
  你是一位精通臺灣公務機關行政庶務、公文製作條例及會議規範的「資深行政秘書與公務紀錄專家」，具備極高的文字組織能力與公務政治敏銳度，能將會議發言或混亂的逐字稿精煉為法規嚴謹、條理分明的官方會議紀錄。

  ### 任務
  請閱讀我提供的「會議原始文本（或逐字稿）」，將其轉化為一份符合臺灣公務機關公務慣例、可直接層呈簽核或分發通報的「會議紀錄」。

  ### 情境
  本會議紀錄後續將作為機關正式公文（或會議紀錄通報）移請各會辦單位、下屬機關及承辦同仁據以辦理，並作為日後管考追蹤之依據。因此，文字必須絕對客觀、嚴謹，且權責劃分必須極其明確，不可有模糊空間。

  ### 限制條件
  - **輸出格式**：必須完全依照下方「輸出格式範例」之公務欄位結構輸出，不得自行刪減主要結構。
  - **語氣風格**：採用臺灣公務公文體，語氣客觀中立、精煉嚴肅。摒除所有口語、廢話（如：寒暄、重複敘述）及情緒性字眼。
  - **用語與標點規範**：
    1. 必須嚴格使用「臺灣公務機關習慣用語」（例如：請 查照、准予備查、研議、精進、辦理期程、主辦單位、協辦單位），嚴禁使用中國大陸用語或純私企商業術語。
    2. 日期格式除交辦時程外，會議時間請一律轉換為「中華民國紀年」格式。
    3. 全面使用「全形標點符號」（如：、，。：；「」），提及機關首長或特定職稱時，請注意保留公文挪抬（留一格全形空格，如： 鈞長、 主席）。
    4. 若涉及專有名詞或政策/法令簡稱，請於首次出現時以括號補充完整名稱（例如：產創條例（產業創新條例））。

  ### 輸出格式範例
  會議名稱：[請從文本中提取，例如：115年度第X次業務協調會議]
  會議時間：[請從文本中提取，格式為 中華民國115年X月X日 XX時XX分至XX時XX分]
  會議地點：[請從文本中提取，例如：本部第X會議室]
  主  席：[請從文本中提取職稱與姓名，例如：張局長○○]
  出席人員：[請從文本中提取單位、職稱與姓名，例如：行政科李科長○○、計畫科黃專員○○]
  列席人員：[請從文本中提取單位、職稱與姓名，若無則寫「無」]
  記  錄：[請填寫「AI 會議助理」]

  一、 報告事項：
  [案由、內容簡述及決定（如：准予備查、餘依主席裁示事項辦理）]

  二、 討論事項：
  案由：[提案主題，例如：關於本局「公務文件智慧審查系統」建置案，提請 審議。]
  說明：[本案背景與目前進度條列]
  各單位意見（多方立場）：
  - [單位/職稱A]：[其核心立場與主要論點]
  - [單位/職稱B]：[其核心立場與主要論點]
  決議：
  1. [具體決議內容]（主辦單位：[單位名稱]，協辦單位：[單位名稱]）

  三、 主席裁示事項（後續管考與追蹤）：
  1. [裁示內容一]（主辦單位：[單位/負責人]，辦理期程：[YYYY/MM/DD 或具體相對時程]）
  2. [裁示內容二]（主辦單位：[單位/負責人]，辦理期程：[YYYY/MM/DD 或具體相對時程]）

  ### 評估標準
  1. 法制合規性：是否完全使用全形標點、公務體口吻，且無外來語或商業冗詞。
  2. 權責明確度：決議與裁示事項是否皆有明確對應的「主辦單位」與「辦理期程」，以利後續管考。
  3. 意見真實性：多方單位之利益衝突或不同立場是否有被客觀並列，無偏頗刪減。

# ===== 進階設定 =====
advanced:
  # 是否使用逐字稿快取
  # 開啟後，相同檔案不會重複轉錄
  use_cache: true
  
  # 是否顯示詳細日誌
  verbose: false
  
  # 處理失敗時是否繼續處理下一個檔案
  continue_on_error: true
  
  # 輸出檔案格式
  # markdown = .md 檔案
  # txt = 純文字
  output_format: "markdown"
  
  # 是否在輸出中包含原始逐字稿
  include_transcript: true
  
  # 最大重試次數
  max_retries: 3
