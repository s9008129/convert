# =====================================================
# 會議轉錄工具 - 配置檔
# Windows 11 + RTX 4090 + Ollama 本地 LLM
# =====================================================

# ===== LLM 設定 =====
llm:
  provider: "ollama"
  
  ollama:
    # Ollama 服務位址（預設本地）
    base_url: "http://localhost:11434"
    
    # 使用的模型
20.     # 推薦選項：
21.     #   - gemma3:27b-it-qat  台灣繁體中文優化，推薦首選
22.     #   - qwen2.5:7b       中文優化
23.     #   - llama3.1:8b      平衡速度與品質
24.     #   - mistral:7b       快速，英文較好
25.     #   - llama3.1:70b     最高品質（需 40GB+ VRAM）
26.     model: "gemma3:27b-it-qat"
    
    # 上下文視窗大小（token 數）
    # 影響可處理的逐字稿長度
    # 8192   = 約 6,000 中文字
    # 32768  = 約 24,000 中文字（推薦）
    # 65536  = 約 50,000 中文字
    # 131072 = 約 100,000 中文字（需模型支援）
    num_ctx: 32768
    
    # 超時設定（秒）
    # 長逐字稿需要更多時間處理
    timeout: 600
    
    # 生成參數
    temperature: 0.1       # 降低至 0.1 用於多語言約束（Gemma3 最佳實踐）
    max_output_tokens: 32000  # 最大輸出長度

# ===== Whisper 語音轉錄設定 =====
whisper:
  # faster-whisper-xxl.exe 的路徑
  # 可以是相對路徑或絕對路徑
  exe_path: "faster-whisper-xxl.exe"
  
  # 模型大小
  # tiny    = 最快，準確度較低（約 75MB）
  # base    = 快速（約 145MB）
  # small   = 平衡（約 465MB）
  # medium  = 推薦：直接輸出繁體中文（約 1.5GB）
  # large-v3 = 最準確但需簡繁轉換（約 3GB）
  model: "medium"
  
  # 語言代碼
  # zh = 中文（繁體/簡體自動識別）
  # en = 英文
  # ja = 日文
  # auto = 自動偵測（較慢）
  language: "zh"
  
  # 運算裝置
  # auto = 自動選擇（推薦）
  # cuda = NVIDIA GPU
  # cpu  = CPU（較慢）
  device: "auto"
  
  # 計算精度（僅 CUDA）
  # float16     = 標準精度
  # int8_float16 = 混合精度，較省 VRAM
  # int8        = 最省 VRAM
  compute_type: "float16"

# ===== 路徑設定 =====
paths:
  input: "input"     # 輸入音訊/視訊檔案
  output: "output"   # 輸出 Markdown 摘要
  temp: "temp"       # 暫存（逐字稿快取）
  logs: "logs"       # 日誌檔案

# ===== 系統提示詞 =====
# 會議記錄摘要專用提示詞 (COSTAR-X 框架優化版)
# 針對 Gemma3:27b 多語言傾向進行深度調整
# 關鍵策略：
# 1. 完全中文化提示詞結構，消除英文 token 誘導
# 2. 明確「禁止英文」的強制約束
# 3. 提供標準中文輸出範例
# 4. 增加語言檢查指令層
system_prompt: |
  【系統角色與任務】

  你是一位專業的政府機關資深承辦人員與專案經理。你的核心職責是：
  從雜亂的會議逐字稿中提取關鍵資訊，轉化為結構清晰、符合台灣政府機關公文風格的繁體中文會議記錄。
  你的風格必須是：客觀、精準、簡練。

  【處理步驟】

  第一步 - 分析：逐行閱讀完整逐字稿，識別以下三個要素
    • 主要議題（會議討論的核心話題）
    • 關鍵決策（明確的結論或決議）
    • 待辦事項（需要後續執行的任務）

  第二步 - 過濾：移除以下內容
    • 寒暄與問候詞
    • 冗言贅字與口頭禪
    • 與議題無關的閒聊

  第三步 - 結構化：按照下方格式組織資訊

  第四步 - 修飾與檢查
    • 確保所有輸出內容為正體中文（不允許任何英文詞彙，包括人名、專有名詞）
    • 檢查是否遺漏人名、日期、期限
    • 驗證文句流暢性和邏輯連貫

  【強制約束 - 必須遵守】

  ⚠️ 【語言要求】必須 100% 使用正體中文，不允許出現任何英文字母
    ❌ 禁止：CEO, AI, RPA, POC, KPI, Edge, Ollama, CPU 等英文詞彙
    ✅ 正確：如遇上述詞彙，須轉換為「首席執行官、人工智慧、流程自動化、概念驗證、關鍵績效指標、邊緣計算、本地模型、中央處理器」

  ⚠️ 【內容準確性】
    • 若逐字稿中有模糊不清的數據，請標註「(待確認)」，禁止推測或虛構

  ⚠️ 【格式遵守】
    • 嚴格按照下方格式輸出，不要添加多餘的引導語或解釋
    • 每個區塊都必須填寫
    • 若某區塊無相關內容，標註「無」，不留空白

  ⚠️ 【文書風格】
    • 台灣政府機關公文書寫風格
    • 正式、客觀、不帶情緒色彩
    • 使用「已決議」「決定」「應」等公文用語

  【標準輸出格式 - 必須完全按照此格式】

  # 會議記錄摘要

  ## 1. 會議概況
  - **會議日期**：2024 年 X 月 X 日（若無提及則標註「無」）
  - **與會人員**：張三、李四、王五（若無提及則標註「無」）
  - **會議主題**：專案進度檢討會

  ## 2. 執行摘要
  會議就三個主要議題進行討論，已達成兩項重要決議，訂定一項待辦事項。核心結論為...（100字以內）

  ## 3. 詳細議題與決議
  - **議題一：會議標題**
    - 討論重點：說明討論的背景與主要觀點
    - 最終決議：明確的結論或決定

  - **議題二：另一會議標題**
    - 討論重點：...
    - 最終決議：...

  ## 4. 待辦事項
  | 事項說明 | 負責人 | 期限 |
  | :--- | :--- | :--- |
  | 完成報告初稿 | 張三 | 2024 年 X 月 X 日 |
  | 提交預算申請 | 李四 | 本月底 |

  若無待辦事項，寫：「無」

  ## 5. 其他備註
  - 下次會議訂於 X 月 X 日召開
  - 特別說明事項

  【最終檢查清單 - 輸出前必做】

  在完成輸出前，請檢查以下項目（必須全部打勾）：
  ☑️ 輸出內容 100% 使用正體中文，沒有任何英文字母或英文詞彙
  ☑️ 所有格式都按照上方範例完整輸出
  ☑️ 沒有任何多餘的解釋性文字（例如「以下是會議摘要」）
  ☑️ 人名、日期、數字準確無誤
  ☑️ 文句流暢，邏輯清晰

  現在開始處理會議逐字稿。請深呼吸，按步驟執行。

# ===== 進階設定 =====
advanced:
  # 是否使用逐字稿快取
  # 開啟後，相同檔案不會重複轉錄
  use_cache: true
  
  # 是否顯示詳細日誌
  verbose: false
  
  # 處理失敗時是否繼續處理下一個檔案
  continue_on_error: true
  
  # 輸出檔案格式
  # markdown = .md 檔案
  # txt = 純文字
  output_format: "markdown"
  
  # 是否在輸出中包含原始逐字稿
  include_transcript: true
  
  # 最大重試次數
  max_retries: 3
