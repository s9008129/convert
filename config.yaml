# =====================================================
# 會議轉錄工具 - 配置檔
# Windows 11 + RTX 4090 + Ollama 本地 LLM
# =====================================================

# ===== LLM 設定 =====
llm:
  provider: "ollama"
  
  ollama:
    # Ollama 服務位址（預設本地）
    base_url: "http://localhost:11434"
    
    # 使用的模型（預設切換為 gemma4 家族；mac 可在 compose / .env.local 覆蓋較小標籤）
    # 推薦選項：
    #   - gemma4:31b         共用預設，若只安裝 q4 變體可交由後端自動解析
    #   - gemma4:31b-it-q4_K_M  Windows / RTX 4090 常見實用安裝變體
    #   - mistral-small3.2:latest  小型高效模型
    #   - qwen2.5:7b         中文優化
    #   - llama3.1:8b        平衡速度與品質
    model: "gemma4:31b"
    
    # 有效上下文視窗大小（token 數）
    # Gemma 類本地模型實測以 8192 較穩定；更長逐字稿應交由分塊流程處理
    # 8192 = 約 6,000 中文字（建議）
    num_ctx: 8192
    
    # 超時設定（秒）
    # 長逐字稿需要更多時間處理
    timeout: 600
    
    # 生成參數（Gemma4 建議值；實際 extraction / merge / refine 由後端流程分階段控制）
    temperature: 0.2       # 最終摘要建議溫度
    top_k: 64              # v4.0.0 新增 - Google 推薦
    top_p: 0.95            # v4.0.0 新增 - Google 推薦
    repeat_penalty: 1.08   # Gemma4 本地摘要降低重複
    max_output_tokens: 3072   # 最終輸出 / refine 預留長度

# ===== Whisper / ASR 語音轉錄設定 =====
whisper:
  backend: "transformers"
  model: "MediaTek-Research/Breeze-ASR-26"
  model_revision: "949c87bca9dbe90e160cf739460cc765e80805f3"
  local_files_only: false
  
  # 語言代碼
  # auto = 自動判斷（較適合繁中 / 英文 / 台語混合語音）
  language: "auto"
  
  # 運算裝置
  # auto = 自動選擇（推薦）
  # cuda = NVIDIA GPU
  # cpu  = CPU（較慢）
  device: "auto"
  
  # 計算精度（僅 CUDA）
  # int8_float16 = faster-whisper 混合精度
  # float16     = 標準精度
  # int8        = 最省 VRAM
  compute_type: "float16"
  
  # VAD（語音活動偵測）設定 - v4.0.0 新增
  vad:
    enabled: true
    threshold: 0.5            # 語音偵測閾值（0-1）
    min_speech_duration_ms: 250    # 最短語音持續時間
    min_silence_duration_ms: 2000  # 觸發分割的靜音時間
    speech_pad_ms: 400        # 語音前後保留緩衝
  
  # 轉錄參數
  beam_size: 5
  initial_prompt: "以下是台灣繁體中文的會議記錄。"

# ===== 路徑設定 =====
paths:
  input: "input"     # 輸入音訊/視訊檔案
  output: "output"   # 輸出 Markdown 摘要
  temp: "temp"       # 暫存（逐字稿快取）
  logs: "logs"       # 日誌檔案

# ===== 系統提示詞 =====
# 會議記錄摘要專用提示詞（extraction-first 簡化版）
# 與 backend/core/config.py 維持同一份核心契約，避免後續漂移
system_prompt: |
  你是台灣政府機關的會議紀錄整理助理。請先抽取逐字稿中的明確事實，再整理成正式、客觀、可追蹤的會議記錄。

  任務流程：
  1. 先抽取日期、參與者、會議主題、議題、決議、待辦事項、風險與待確認資訊。
  2. 再整理成台灣常用公文風格；刪除寒暄、贅詞與重複，但保留人名、數字、期限、責任人與關鍵條件。
  3. 若資訊不足或彼此矛盾，請標示「（待確認）」；不得補寫逐字稿未提及的內容。

  寫作規則：
  - 輸出以繁體中文（台灣用語）為主，語氣正式、客觀、精準。
  - 專有名詞、產品名、英文縮寫若影響準確性可保留，必要時可附中文說明，不要為了硬性翻譯而犧牲忠實度。
  - 不要輸出任何前言、解釋、推理過程或客套話。
  - 嚴禁輸出簡體中文、<think> / <thought> / <details>、XML/HTML 標籤或 Markdown code fence。

  輸出前請自查：
  - 五個章節都存在且順序正確。
  - 每個議題都至少包含「討論重點」與「最終決議」。
  - 所有明確交辦都必須出現在待辦事項表格中。
  - 若逐字稿未提及欄位，請填寫「逐字稿未提及」或「（待確認）」。

  請直接輸出以下 Markdown：

  # 會議記錄摘要

  ## 1. 會議概況
  - **日期**：...
  - **參與者**：...
  - **會議主題**：...

  ## 2. 執行摘要 (Executive Summary)
  以 120-180 字總結會議核心結論、重要決議與待辦重點。

  ## 3. 詳細議題與決議 (Discussion & Decisions)
  - **議題 1**：...
    - *討論重點*：...
    - *最終決議*：...

  ## 4. 待辦事項 (Action Items) - 必填
  | 待辦事項 | 負責人 | 期限 |
  | :--- | :--- | :--- |
  | ... | ... | ... |

  若沒有明確待辦事項，也必須輸出表格並填入：
  | （本次會議未明確指派待辦事項） | — | — |

  ## 5. 其他備註
  - 補充風險、後續追蹤或待確認資訊；若無則寫「無」。

# ===== 進階設定 =====
advanced:
  # 是否使用逐字稿快取
  # 開啟後，相同檔案不會重複轉錄
  use_cache: true
  
  # 是否顯示詳細日誌
  verbose: false
  
  # 處理失敗時是否繼續處理下一個檔案
  continue_on_error: true
  
  # 輸出檔案格式
  # markdown = .md 檔案
  # txt = 純文字
  output_format: "markdown"
  
  # 是否在輸出中包含原始逐字稿
  include_transcript: true
  
  # 最大重試次數
  max_retries: 3
