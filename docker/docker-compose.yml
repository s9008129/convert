# ============================================================
# docker-compose.yml
# MeetingScribe v3.3.4 - Windows/Linux 通用版（CUDA GPU 支援）
# ============================================================
# 
# 🔒 隔離保證：
# - 使用獨立的 COMPOSE_PROJECT_NAME (meetingscribe)
# - 使用獨立的 Docker 網路 (meetingscribe-network)
# - 使用帶專案前綴的 Volume 命名
# - 設定資源限制，不影響其他 Docker 服務
# 
# 🎮 GPU 支援：
# - v3.3.4 啟用 NVIDIA GPU 支援（預設開啟）
# - 自動偵測 GPU，無 GPU 時自動降級到 CPU 模式
# - 需要 Docker Desktop 啟用 WSL2 後端
# 
# ============================================================

# 專案名稱（確保與其他專案完全隔離）
name: meetingscribe

services:
  # ========================================
  # 主應用服務（Windows/Linux CUDA 版）
  # ========================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: meetingscribe:latest
    container_name: meetingscribe-app
    hostname: meetingscribe-app
    restart: unless-stopped
    
    # 載入環境變數檔案
    env_file:
      - ../.env
    
    # ========================================
    # GPU 資源配置 - v3.3.4 啟用 NVIDIA GPU
    # ========================================
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    ports:
      - "9527:9527"
    
    environment:
      # ========================================
      # GPU 運算設定（v3.3.4 新增）
      # ========================================
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      
      # ========================================
      # 本地模式設定（Ollama - 連接主機）
      # ========================================
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LOCAL_LLM_MODEL=gemma3:27b-it-qat
      
      # ========================================
      # 本地模式設定（LM Studio - OpenAI 相容 API）
      # ========================================
      - LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
      - LMSTUDIO_MODEL=gpt-oss-20b
      
      # ========================================
      # 雲端模式設定（Gemini API）
      # ========================================
      - GEMINI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
      - GEMINI_MODEL=gemini-2.5-flash-lite
      # GEMINI_API_KEY 從 .env 檔案讀取
      
      # ========================================
      # Whisper 轉錄設定
      # ========================================
      - WHISPER_MODEL=medium
      - WHISPER_DEVICE=auto
      
      # ========================================
      # 排隊系統設定（v2.1 新增）
      # ========================================
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-200}
      - ENABLE_BATCH_UPLOAD=${ENABLE_BATCH_UPLOAD:-false}
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-1}
      - QUEUE_MAX_SIZE=${QUEUE_MAX_SIZE:-50}
      
      # ========================================
      # 系統設定
      # ========================================
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEFAULT_MODE=${DEFAULT_MODE:-local}
    
    volumes:
      - ../data/uploads:/app/data/uploads
      - ../data/outputs:/app/data/outputs
      - ../data/cache:/app/data/cache
      - meetingscribe-whisper-models:/app/models
      # 開發模式：前端檔案即時同步（修改後重整瀏覽器即可）
      - ../frontend:/app/frontend
      # 開發模式：後端程式碼即時同步（需重啟容器）
      - ../backend:/app/backend
    
    # 允許連接主機網路（存取 Ollama）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # 獨立網路 - 完全隔離，不影響其他 Docker 服務
    networks:
      - meetingscribe-network
    
    # 標籤：方便識別和管理
    labels:
      - "com.meetingscribe.project=meetingscribe"
      - "com.meetingscribe.version=3.3.4"
      - "com.meetingscribe.platform=windows-linux"
      - "com.meetingscribe.description=會議音檔轉錄服務"
      - "com.meetingscribe.gpu=nvidia"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9527/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

# ========================================
# 網路配置 - 完全獨立隔離網路
# ========================================
networks:
  meetingscribe-network:
    driver: bridge
    name: meetingscribe-network
    # 獨立的 IP 範圍，避免與其他專案衝突
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
    labels:
      - "com.meetingscribe.project=meetingscribe"

# ========================================
# 持久化存儲（使用專案前綴命名）
# ========================================
volumes:
  meetingscribe-whisper-models:
    driver: local
    name: meetingscribe-whisper-models
    labels:
      - "com.meetingscribe.project=meetingscribe"

# ============================================================
# ⚠️ Windows/Linux GPU 支援說明 (v3.3.4)：
# 
# 🎮 GPU 自動偵測：
# - 容器會自動偵測可用的 NVIDIA GPU
# - 無 GPU 時會自動降級到 CPU 模式（Whisper 使用 int8 量化）
# 
# 📋 先決條件（Windows）：
# 1. Docker Desktop 需啟用 WSL2 後端
# 2. 安裝最新版 NVIDIA 驅動程式（支援 CUDA）
# 3. Docker Desktop Settings → Resources → GPU → 勾選 Enable GPU
# 
# 📋 先決條件（Linux）：
# 1. 安裝 NVIDIA Container Toolkit
#    curl -s -L https://nvidia.github.io/nvidia-docker/gpgkey | sudo apt-key add -
#    curl -s -L https://nvidia.github.io/nvidia-docker/$(. /etc/os-release;echo $ID$VERSION_ID)/nvidia-docker.list | \
#      sudo tee /etc/apt/sources.list.d/nvidia-docker.list
#    sudo apt-get update && sudo apt-get install -y nvidia-container-toolkit
#    sudo systemctl restart docker
# 
# 🔍 驗證 GPU 支援：
#    docker run --rm --gpus all nvidia/cuda:12.0-base nvidia-smi
# 
# 🔒 隔離保證：
# - 此服務使用獨立網路 (172.30.0.0/16)
# - 不會與其他 Docker 專案共用網路
# - 資源限制確保不會影響其他服務運行
# ============================================================
