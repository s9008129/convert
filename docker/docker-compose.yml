# docker-compose.yml
# MeetingScribe v2.1 - 服務隔離版（不影響其他 Docker 服務）
version: '3.8'

services:
  # ========================================
  # 主應用服務（唯一服務）
  # ========================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: meetingscribe:latest
    container_name: meetingscribe-app
    restart: unless-stopped
    
    # GPU 支援配置（可選，無 GPU 時自動降級到 CPU）
    deploy:
      resources:
        # 資源限制 - 避免影響其他服務
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    ports:
      - "9527:9527"
    
    environment:
      # ========================================
      # 本地模式設定（Ollama - 連接主機）
      # ========================================
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LOCAL_LLM_MODEL=gemma3:12b
      
      # ========================================
      # 雲端模式設定（Gemini API）
      # ========================================
      - GEMINI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
      - GEMINI_MODEL=gemini-2.5-flash-lite
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      
      # ========================================
      # Whisper 轉錄設定
      # ========================================
      - WHISPER_MODEL=large-v3
      - WHISPER_DEVICE=auto
      
      # ========================================
      # 排隊系統設定（v2.1 新增）
      # ========================================
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
      - ENABLE_BATCH_UPLOAD=${ENABLE_BATCH_UPLOAD:-false}
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-1}
      - QUEUE_MAX_SIZE=${QUEUE_MAX_SIZE:-50}
      
      # ========================================
      # 系統設定
      # ========================================
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEFAULT_MODE=${DEFAULT_MODE:-local}
    
    volumes:
      - ../data/uploads:/app/data/uploads
      - ../data/outputs:/app/data/outputs
      - ../data/cache:/app/data/cache
      - whisper-models:/app/models
    
    # 允許連接主機網路（存取 Ollama）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # 獨立網路 - 不影響其他 Docker 服務
    networks:
      - meetingscribe-isolated-net
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9527/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

# ========================================
# 網路配置 - 獨立隔離網路
# ========================================
networks:
  meetingscribe-isolated-net:
    driver: bridge
    name: meetingscribe-isolated-net

# ========================================
# 持久化存儲
# ========================================
volumes:
  whisper-models:
    driver: local

# ⚠️ 注意：
# 1. 不包含 Ollama 服務，使用主機已安裝的版本
# 2. 透過 host.docker.internal 連接主機 Ollama
# 3. 獨立網路確保不影響其他 Docker 服務
