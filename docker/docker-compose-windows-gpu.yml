# ============================================================
# docker-compose-windows-gpu.yml
# MeetingScribe v4.0.0 - Windows + RTX 4090 專用 GPU 加速版
# ============================================================
# 
# 此配置針對 Windows 11/10 + NVIDIA RTX 4090 GPU 優化
# 使用 NVIDIA CUDA 12 + cuDNN 8/9 基底映像支援 faster-whisper GPU 加速
#
# v4.2 更新：
# - ASR 模型：Breeze-ASR-26（transformers 路徑；重疊分塊解碼）
# - 語意校正機制（詞彙表 hotwords ＋ LLM 校正 ＋ 同音閘門）
# - 程式碼 volume 掛載（零 rebuild）；模型持久化 Volume 確保不重複下載
#
# 重要依賴（參見 INSTRUCTIONS.md）：
# - cuDNN 8 庫：Whisper 語音識別必需
# - cuDNN 9 庫：CTranslate2 推理引擎
# - 參考: https://opennmt.net/CTranslate2/installation.html
# 
# 使用方式（P2-1 零 rebuild 策略）：
#   cd docker
#   docker compose -f docker-compose-windows-gpu.yml build   # 僅首次或依賴變更時
#   docker compose -f docker-compose-windows-gpu.yml up -d
#
#   改 backend/frontend 程式碼或提示詞 → 只需：
#   docker compose -f docker-compose-windows-gpu.yml restart
#   （程式碼已用 volume 掛載，不需 rebuild、不會下載任何東西）
#
# 🚫 頻寬紅線：
#   - 嚴禁 build --no-cache（會重抓 apt/pip 數百 MB～數 GB）
#   - 嚴禁 docker compose down -v（會清空 6GB ASR 模型 volume，重新下載）
# ============================================================

name: meetingscribe-win-gpu

services:
  # ========================================
  # 主應用服務（CUDA 12 + cuDNN 9 GPU 加速版）
  # ========================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    image: meetingscribe:windows-gpu-cuda12
    container_name: meetingscribe-app
    hostname: meetingscribe-app
    restart: unless-stopped
    
    # 載入環境變數檔案
    env_file:
      - ../.env
    
    # ========================================
    # RTX 4090 資源配置（可選）
    # 取消註解以限制資源使用
    # ========================================
    deploy:
      resources:
        limits:
          # RTX 4090 有 24GB VRAM，可安全分配 16GB 給容器
          memory: 16G
          cpus: '8'
        reservations:
          # 預留資源確保容器永遠有足夠資源
          cpus: '2'
          memory: 4G
          # 啟用 GPU 支援（需要 NVIDIA Container Toolkit）
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    ports:
      - "9527:9527"
    
    environment:
      # ========================================
      # GPU 運算設定（RTX 4090 優化）
      # ========================================
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      
      # ========================================
      # 本地模式設定（Ollama - 連接主機）
      # v4.2.1: 預設 gemma4:31b；若主機實際安裝 gemma4:31b-it-q4_K_M，後端會自動解析
      # ========================================
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LOCAL_LLM_MODEL=gemma4:31b
      
      # ========================================
      # Whisper / ASR 設定（官方 Breeze-ASR-26，與 docker-compose.yml 一致）
      # ========================================
      - ASR_BACKEND=transformers
      - WHISPER_MODEL=MediaTek-Research/Breeze-ASR-26
      - WHISPER_MODEL_REVISION=949c87bca9dbe90e160cf739460cc765e80805f3
      - WHISPER_LANGUAGE=auto
      - WHISPER_DEVICE=auto
      - WHISPER_COMPUTE_TYPE=float16

      # ========================================
      # 語意校正（v4.2 新增）＋ LLM keep_alive（P0-7）
      # ========================================
      - ENABLE_TRANSCRIPT_CORRECTION=${ENABLE_TRANSCRIPT_CORRECTION:-true}
      - CORRECTION_SCOPE=${CORRECTION_SCOPE:-all}
      - LOCAL_LLM_KEEP_ALIVE=${LOCAL_LLM_KEEP_ALIVE:-10m}
      
      # ========================================
      # 檔案上傳限制（RTX 4090 可處理更大檔案）
      # ========================================
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-500}
      - ENABLE_BATCH_UPLOAD=${ENABLE_BATCH_UPLOAD:-true}
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-2}
      - QUEUE_MAX_SIZE=${QUEUE_MAX_SIZE:-100}
      
      # ========================================
      # 系統設定
      # ========================================
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEFAULT_MODE=${DEFAULT_MODE:-local}
      - PYTHONUNBUFFERED=1
    
    volumes:
      - ../data/uploads:/app/data/uploads
      - ../data/outputs:/app/data/outputs
      - ../data/cache:/app/data/cache
      - ../data/glossary:/app/data/glossary
      - meetingscribe-whisper-models:/app/models
      # P2-1 零 rebuild：程式碼與提示詞用 volume 掛載，
      # 改 code/prompt 只需 docker compose restart，不需 rebuild
      - ../backend:/app/backend
      - ../frontend:/app/frontend
      - ../VERSION:/app/VERSION:ro
    
    # 允許連接主機網路（存取 Ollama）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # 獨立網路 - 完全隔離
    networks:
      - meetingscribe-network
    
    # 標籤：方便識別
    labels:
      - "com.meetingscribe.project=meetingscribe"
      - "com.meetingscribe.version=4.0.0"
      - "com.meetingscribe.platform=windows-gpu"
      - "com.meetingscribe.gpu=rtx4090"
      - "com.meetingscribe.cuda=12.3"
      - "com.meetingscribe.cudnn=8+9"
      - "com.meetingscribe.asr=breeze-asr-26"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9527/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

# ========================================
# 網路配置 - 完全獨立隔離
# ========================================
networks:
  meetingscribe-network:
    driver: bridge
    name: meetingscribe-network
    # 獨立的 IP 範圍，避免與其他專案衝突
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
    labels:
      - "com.meetingscribe.project=meetingscribe"

# ========================================
# 持久化存儲
# ========================================
volumes:
  meetingscribe-whisper-models:
    driver: local
    name: meetingscribe-whisper-models
    labels:
      - "com.meetingscribe.project=meetingscribe"

# ============================================================
# Windows RTX 4090 部署檢查清單：
#
# ✅ Docker Desktop GPU 支援已啟用
# ✅ NVIDIA Container Toolkit 已安裝
# ✅ NVIDIA 驅動版本 >= 520
# ✅ nvidia-smi 正常工作
# ✅ Ollama 服務運行中（建議環境變數：OLLAMA_FLASH_ATTENTION=1、OLLAMA_KV_CACHE_TYPE=q8_0）
#
# 部署命令（首次或 requirements.txt / Dockerfile 變更時才需要 build）：
#   cd docker
#   docker compose -f docker-compose-windows-gpu.yml build
#   docker compose -f docker-compose-windows-gpu.yml up -d
#
# 日常更新（改程式碼/提示詞後）：
#   git pull && docker compose -f docker-compose-windows-gpu.yml restart
#
# 監控 GPU 使用：
#   nvidia-smi -l 1
#
# 驗證 CUDA 是否可用：
#   docker exec meetingscribe-app python -c "import torch; print(f'CUDA: {torch.cuda.is_available()}')"
# ============================================================
